
[functions.sync-google-sheet]
enabled = true
verify_jwt = false
import_map = "./functions/sync-google-sheet/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/sync-google-sheet/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/sync-google-sheet/*.html" ]

[functions.merge-duplicate-account]
enabled = true
verify_jwt = true
import_map = "./functions/merge-duplicate-account/deno.json"
entrypoint = "./functions/merge-duplicate-account/index.ts"

[functions.check-user-registration]
enabled = true
# 前端以 supabase.functions.invoke 呼叫，未登入時自帶 anon key JWT 可通過驗證；
# 保持 true 以阻擋不帶 anon key 的裸掃描（此 function 會回應 Email 是否已註冊）
verify_jwt = true
import_map = "./functions/check-user-registration/deno.json"
entrypoint = "./functions/check-user-registration/index.ts"

[functions.send-invitations]
enabled = true
verify_jwt = false
import_map = "./functions/send-invitations/deno.json"
entrypoint = "./functions/send-invitations/index.ts"

[functions.send-event-reminder]
enabled = true
verify_jwt = false
import_map = "./functions/send-event-reminder/deno.json"
entrypoint = "./functions/send-event-reminder/index.ts"

[functions.admin-create-user]
enabled = true
verify_jwt = true
import_map = "./functions/admin-create-user/deno.json"
entrypoint = "./functions/admin-create-user/index.ts"

[functions.reset-user-account]
enabled = true
verify_jwt = true
import_map = "./functions/reset-user-account/deno.json"
entrypoint = "./functions/reset-user-account/index.ts"
